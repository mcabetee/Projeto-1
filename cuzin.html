<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário com Tarefas</title>
    
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .calendar {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 350px;
        }
        .month-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .month-header button {
            background: #007bff;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .month-header button:hover {
            background: #0056b3;
        }
        .month-header h2 {
            margin: 0;
            font-size: 20px;
        }
        .weekdays, .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
        }
        .weekdays div {
            font-weight: bold;
            color: #666;
            padding-bottom: 10px;
        }
        .days-grid div {
            padding: 10px 0;
            cursor: pointer;
            margin-bottom: 5px;
            border-radius: 4px;
            position: relative;
        }
        .days-grid div:hover {
            background-color: #e0e0e0;
        }
        
        /* Cor para dias comuns com TAREFAS pendentes (Laranja) */
        .days-grid .has-task {
            background-color: #ff9800;
            color: white;
            font-weight: bold;
        }
        .days-grid .has-task:hover {
            background-color: #e68a00;
        }

        /* Cor para o DIA ATUAL (Azul) */
        .days-grid .today {
            background-color: #007bff;
            color: white;
            font-weight: bold;
        }
        /* Se o dia atual TAMBÉM tiver tarefa (Roxo) */
        .days-grid .today.has-task {
            background-color: #673ab7; 
        }
        .days-grid .today.has-task:hover {
            background-color: #512da8;
        }
        
        .days-grid .empty {
            cursor: default;
        }
        .days-grid .empty:hover {
            background-color: transparent;
        }
    </style>
</head>
<body>

    <div class="calendar">
        <div class="month-header">
            <button id="prev-btn">&lt;</button>
            <h2 id="month-year"></h2>
            <button id="next-btn">&gt;</button>
        </div>
        <div class="weekdays">
            <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
        </div>
        <div class="days-grid" id="days-container"></div>
    </div>

    <script>
        const monthYear = document.getElementById('month-year');
        const daysContainer = document.getElementById('days-container');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        // Data real de hoje
        const today = new Date();
        const todayDay = today.getDate();
        const todayMonth = today.getMonth();
        const todayYear = today.getFullYear();

        // Variáveis de navegação do calendário
        let currentMonth = today.getMonth();
        let currentYear = today.getFullYear();

        const months = [
            "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", 
            "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"
        ];

        // Chave do dia de hoje gerada dinamicamente
        const todayKey = `${todayYear}-${todayMonth}-${todayDay}`;

        // Lista de tarefas contendo dinamicamente o dia de hoje
        const tasks = [
            todayKey,       // Adiciona a tarefa no dia de hoje automaticamente
            "2026-7-25",    
            "2026-8-05"     
        ];

        function renderCalendar() {
            monthYear.innerHTML = `${months[currentMonth]} ${currentYear}`;

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

            let daysHTML = "";

            for (let i = 0; i < firstDayIndex; i++) {
                daysHTML += `<div class="empty"></div>`;
            }

            for (let i = 1; i <= totalDays; i++) {
                let classes = [];

                if (i === todayDay && currentMonth === todayMonth && currentYear === todayYear) {
                    classes.push("today");
                }

                const dateKey = `${currentYear}-${currentMonth}-${i}`;
                if (tasks.includes(dateKey)) {
                    classes.push("has-task");
                }

                const classString = classes.length > 0 ? `class="${classes.join(' ')}"` : '';
                daysHTML += `<div ${classString}>${i}</div>`;
            }

            daysContainer.innerHTML = daysHTML;
        }

        prevBtn.addEventListener('click', () => {
            currentMonth--;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        });

        nextBtn.addEventListener('click', () => {
            currentMonth++;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            renderCalendar();
        });

        renderCalendar();
    </script>
</body>
</html>
