<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sala de Tarefas</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f2f2f2;
        }

        header {
            width: 100%;
            padding: 25px;
            background-color: #222;
            color: white;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 28px;
        }

        .div_inputpesquisa {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input_pesquisa {
            width: 300px;
            padding: 10px;

            border: none;
            border-radius: 5px;
        }

        main {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        /* =========================
           TAREFAS
        ========================= */

        .section_tarefas {
            background-color: white;
            padding: 25px;
            border-radius: 10px;

            margin-bottom: 30px;
        }

        .section_tarefas h2 {
            margin-bottom: 20px;
        }

        .div_inputsTare {
            display: flex;
            gap: 20px;
            align-items: end;
            flex-wrap: wrap;
        }

        .div_inputTextTare,
        .div_inputDateTimeLocalTare {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .input_textTare,
        .input_datetimeLocalTare {
            padding: 10px;

            border: 1px solid #aaa;
            border-radius: 5px;
        }

        .bot_cadasTare {
            padding: 10px 20px;

            border: none;
            border-radius: 5px;

            background-color: #222;
            color: white;

            cursor: pointer;
        }

        .bot_cadasTare:hover {
            background-color: #444;
        }

        /* =========================
           TABELA
        ========================= */

        .div_tarefasRes {
            background-color: white;
            padding: 20px;

            border-radius: 10px;

            margin-bottom: 30px;

            overflow-x: auto;
        }

        .tabela2 {
            width: 100%;
            border-collapse: collapse;
        }

        .tabela2 th,
        .tabela2 td {
            padding: 12px;

            border: 1px solid #ccc;

            text-align: center;
        }

        .tabela2 th {
            background-color: #222;
            color: white;
        }

        /* =========================
           GRÁFICO
        ========================= */

        .section_grafico {
            background-color: white;

            padding: 25px;

            border-radius: 10px;
        }

        .section_grafico h2 {
            margin-bottom: 25px;
        }

        .div_cardGrafico {
            width: 100%;
        }

        .div_grafico {
            width: 100%;
            height: 450px;
        }

        /* =========================
           BOTÃO EXCLUIR
        ========================= */

        .bot_excluir {
            padding: 7px 12px;

            border: none;
            border-radius: 5px;

            background-color: #d33;
            color: white;

            cursor: pointer;
        }

        .bot_excluir:hover {
            background-color: #a00;
        }

    </style>

</head>


<body>


    <!-- =========================
         CABEÇALHO
    ========================= -->

    <header>

        <h1>Sala de Tarefas</h1>

        <div class="div_inputpesquisa">

            <label for="input_pesquisaId">
                Pesquise uma tarefa
            </label>

            <input
                type="search"
                class="input_pesquisa"
                id="input_pesquisaId"
                placeholder="Exemplo: Matemática, História..."
                onkeyup="pesquisa()"
            >

        </div>

    </header>


    <main>


        <!-- =========================
             CADASTRO DE TAREFAS
        ========================= -->

        <section class="section_tarefas">

            <h2>Tarefas:</h2>

            <div class="div_inputsTare">


                <div class="div_inputTextTare">

                    <label for="input_textTareId">
                        Digite o nome da tarefa
                    </label>

                    <input
                        type="text"
                        class="input_textTare"
                        id="input_textTareId"
                        placeholder="Nome da tarefa..."
                    >

                </div>


                <div class="div_inputDateTimeLocalTare">

                    <label for="input_datetimeLocalTareId">
                        Adicione uma data para sua tarefa
                    </label>

                    <input
                        type="datetime-local"
                        class="input_datetimeLocalTare"
                        id="input_datetimeLocalTareId"
                    >

                </div>


                <div>

                    <input
                        type="button"
                        class="bot_cadasTare"
                        value="Cadastrar"
                        onclick="cadastrarTare()"
                    >

                </div>


            </div>

        </section>


        <!-- =========================
             TABELA DE TAREFAS
        ========================= -->

        <div class="div_tarefasRes">

            <table class="tabela2">

                <thead>

                    <tr>

                        <th>Id</th>

                        <th>Nome da Tarefa</th>

                        <th>Data</th>

                        <th>Horário</th>

                        <th>Ações</th>

                    </tr>

                </thead>


                <tbody id="div_tableTarResId">

                </tbody>

            </table>

        </div>


        <!-- =========================
             GRÁFICO
        ========================= -->

        <section class="section_grafico">

            <h2>Desempenho:</h2>

            <div class="div_cardGrafico">

                <div class="div_grafico">

                    <canvas id="graficoTarefas"></canvas>

                </div>

            </div>

        </section>


    </main>


    <script>

        /* =========================================
           ARRAY DAS TAREFAS
        ========================================= */

        let tarefas = [];


        /* =========================================
           VARIÁVEL DO GRÁFICO
        ========================================= */

        let graficoTarefas;


        /* =========================================
           CADASTRAR TAREFA
        ========================================= */

        function cadastrarTare() {

            let nome =
                document.getElementById("input_textTareId").value;

            let data =
                document.getElementById("input_datetimeLocalTareId").value;


            /* Verifica se os campos estão preenchidos */

            if (nome === "" || data === "") {

                alert("Preencha todos os campos!");

                return;

            }


            /* Cria a tarefa */

            let tarefa = {

                id: tarefas.length + 1,

                nome: nome,

                data: data

            };


            /* Coloca a tarefa no array */

            tarefas.push(tarefa);


            /* Atualiza a tabela */

            atualizarTabela();


            /* Atualiza o gráfico */

            atualizarGrafico();


            /* Limpa os inputs */

            document.getElementById("input_textTareId").value = "";

            document.getElementById("input_datetimeLocalTareId").value = "";

        }


        /* =========================================
           ATUALIZAR TABELA
        ========================================= */

        function atualizarTabela() {

            let tabela =
                document.getElementById("div_tableTarResId");


            tabela.innerHTML = "";


            tarefas.forEach(function(tarefa, indice) {


                let dataCompleta =
                    new Date(tarefa.data);


                let data =
                    dataCompleta.toLocaleDateString("pt-BR");


                let horario =
                    dataCompleta.toLocaleTimeString(
                        "pt-BR",
                        {
                            hour: "2-digit",
                            minute: "2-digit"
                        }
                    );


                tabela.innerHTML += `

                    <tr>

                        <td>
                            ${tarefa.id}
                        </td>

                        <td>
                            ${tarefa.nome}
                        </td>

                        <td>
                            ${data}
                        </td>

                        <td>
                            ${horario}
                        </td>

                        <td>

                            <button
                                class="bot_excluir"
                                onclick="excluirTarefa(${indice})"
                            >
                                Excluir
                            </button>

                        </td>

                    </tr>

                `;

            });

        }


        /* =========================================
           EXCLUIR TAREFA
        ========================================= */

        function excluirTarefa(indice) {

            tarefas.splice(indice, 1);


            /* Reorganiza os IDs */

            tarefas.forEach(function(tarefa, indice) {

                tarefa.id = indice + 1;

            });


            atualizarTabela();

            atualizarGrafico();

        }


        /* =========================================
           CRIAR / ATUALIZAR GRÁFICO
        ========================================= */

        function atualizarGrafico() {


            /*
                Cada posição representa um mês:

                0 = Janeiro
                1 = Fevereiro
                2 = Março
                3 = Abril
                4 = Maio
                5 = Junho
                6 = Julho
                7 = Agosto
                8 = Setembro
                9 = Outubro
                10 = Novembro
                11 = Dezembro
            */


            let quantidadePorMes = [

                0, // Janeiro
                0, // Fevereiro
                0, // Março
                0, // Abril
                0, // Maio
                0, // Junho
                0, // Julho
                0, // Agosto
                0, // Setembro
                0, // Outubro
                0, // Novembro
                0  // Dezembro

            ];


            /*
                Passa por todas as tarefas
                e descobre o mês de cada uma.
            */

            tarefas.forEach(function(tarefa) {


                let data =
                    new Date(tarefa.data);


                let mes =
                    data.getMonth();


                quantidadePorMes[mes]++;

            });


            /* Pega o canvas */

            let canvas =
                document.getElementById("graficoTarefas");


            /*
                Se já existir um gráfico,
                ele será apagado antes
                de criar o novo.
            */

            if (graficoTarefas) {

                graficoTarefas.destroy();

            }


            /* =====================================
               CRIA O GRÁFICO
            ===================================== */

            graficoTarefas = new Chart(canvas, {

                type: "bar",


                data: {

                    labels: [

                        "Janeiro",
                        "Fevereiro",
                        "Março",
                        "Abril",
                        "Maio",
                        "Junho",
                        "Julho",
                        "Agosto",
                        "Setembro",
                        "Outubro",
                        "Novembro",
                        "Dezembro"

                    ],


                    datasets: [

                        {

                            label:
                                "Quantidade de tarefas",

                            data:
                                quantidadePorMes,

                            /* COR DAS BARRAS */

                            backgroundColor:
                                "rgb(110, 6, 148)",

                            borderWidth: 1

                        }

                    ]

                },


                options: {

                    responsive: true,

                    maintainAspectRatio: false,


                    scales: {

                        y: {

                            beginAtZero: true,


                            ticks: {

                                stepSize: 1

                            }

                        }

                    }

                }

            });

        }


        /* =========================================
           PESQUISA
        ========================================= */

        function pesquisa() {


            let pesquisa =
                document
                    .getElementById("input_pesquisaId")
                    .value
                    .toLowerCase();


            let linhas =
                document.querySelectorAll(
                    "#div_tableTarResId tr"
                );


            linhas.forEach(function(linha) {


                let texto =
                    linha.textContent.toLowerCase();


                if (texto.includes(pesquisa)) {

                    linha.style.display = "";

                } else {

                    linha.style.display = "none";

                }

            });

        }


        /* =========================================
           CRIA O GRÁFICO VAZIO AO ABRIR A PÁGINA
        ========================================= */

        atualizarGrafico();

    </script>


</body>

</html>
