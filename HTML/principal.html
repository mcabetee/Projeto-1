<!DOCTYPE html>
<html lang="pt-Br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 1</title>
    <link rel="stylesheet" href="/CSS/principal.css">
</head>

<body>

    <header>

        <h1>Nome do site</h1>

    </header>

    <main>

        <section class="section_calenddarioEaviso">

            <div class="div_calen">Calendario 2026</div>

            <div class="div_avis">Aviso</div>

        </section>

        <section class="section_materias">

            <h2>Materias:</h2>

            <div>


                <div class="div_inputsMaterias">

                    <div>

                        <input type="text" class="input_textMateria" name="" id="inputMateria"
                            placeholder="Nome da materia...">
                    </div>

                    <div>

                        <label for="area">Qual área é a sua materia:</label>

                        <select name="area" class="select_area" id="area_select">

                            <optgroup label="Qual Área">

                                <option value="Portugues">Humanas</option>
                                <option value="Historia">Exatas</option>

                            </optgroup>

                    </div>


                    <div class="div_inputBotCadas1">

                        <input type="button" class="input_textMateriaCadas" value="Cadastrar">

                    </div>


                </div>

            </div>

            <div class="div_materiasRes">

                <table class="tabela1">

                    <thead>
                        <tr>
                            <th>Nome da materia</th>
                            <th>Área</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody class="div_tableMatRes"> </tbody>

                </table>

            </div>


        </section>

        <section class="section_tarefas">

            <h2>Tarefas:</h2>

            <div class="div_inputsTarefas">

                <div class="div_inputNomeDaTarefa">

                    <input type="text" name="" id="" placeholder="Nome da tarefa...">

                </div>

                <div class="div_inputNomeDaMateriaTare">

                    <label for="materias">Escolha sua materia:</label>

                    <select name="materias" class="select_materias" id="materias">

                        <optgroup label="Humanas">

                            <option value="Portugues">Portugues</option>
                            <option value="Historia">Historia</option>

                        </optgroup>

                        <optgroup label="Exatas">

                            <option value="Matematica">Matematica</option>
                            <option value="fisica">fisica</option>

                        </optgroup>

                    </select>

                    <!-- Esse input que está comentado é casos o select não de certo <input type="text" name="" id="" placeholder="Nome da materia..."> -->

                </div>

                <div class="div_inputElabelDatetimeTare">

                    <label for="datetime-local">Data que expira as atividades:</label>
                    <input type="datetime-local" name="" id="">

                </div>

                <div class="div_inputBotCadasTare">

                    <input type="button" value="Cadastrar">

                </div>

            </div>

            <div class="div_tarefasRes">

                <table class="tabela2">

                    <thead>
                        <tr>
                            <th>Nome da Tarefa</th>
                            <th>Nome da Materia</th>
                            <th>Área</th>
                            <th>Expira Em</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody class="div_tableTarRes"> </tbody>

                </table>

            </div>

        </section>

        <section class="section_total">

            <div class="div_totalDeMaterias">

                <h3>Total de Materias:</h3>

                <div class="div_totalMateriasRes"></div>

            </div>

            <div class="div_totalDeTarefas">

                <h3>Total de Tarefas:</h3>

                <div class="div_totalTarefasRes"></div>

            </div>

            <div class="div_totalDePendencias">

                <h3>Total de Pendencias:</h3>

                <div class="div_totalPendenRes"></div>

            </div>

        </section>

        <section class="section_grafico">

            <p>grafico</p>

        </section>

    </main>

    <footer>

        <p>&copy;Esse site foi desenvolvido por mariana C e Yuri M</p>

    </footer>

    <script src="/JAVASCRIPT/principal.js"></script>
</body>

</html>
